<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <title>interview detail page 6</title>
        <link rel="stylesheet" href="main.css">
    </head>

    <body>

       <div class="detail-page" style="--accent: #37d1d9; --accent-hover: #0074FF; --icon-w: 186px; --icon-h: 113px;">
            
            <div class="banner" style="--meta-top: 180px;">
                <a class="home-button" href="index.html">home.</a>
                <span class="banner-number">[6]</span>
                <span class="banner-who">my mom</span>
                <h1 class="headline headline-6" style="--headline-size: 353px; --headline-leading: 265px;">
                    <span class="line"><span>I</span><span>CREATE</span></span>
                    <span class="line">THEREFORE</span>
                    <span class="line"><span>I</span><span>AM.</span></span>
                </h1>
            </div>

           <div class="interview-list">

                <section class="interview-block">
                    <div class="question-wrap">
                        <span class="interview-number">[1]</span>
                        <p class="question">Where do you personally stand in relation to creativity?</p>
                    </div>
                    <div class="bubble-row">
                        <img class="icon-photo" src="6.jpg" alt="">
                        <div class="bubble-wrap">
                            <div class="bubble-tail"></div>
                            <input type="checkbox" id="bubble-1" class="bubble-toggle">
                            <label class="bubble" for="bubble-1">
                                <span class="dots">...</span>
                                <div class="answer-wrap">
                                    <div class="answer-inside">
                                        <p class="answer-text">I don’t have much pull toward creativity, mainly because I don’t have many ideas about what to create and limited abilities in various media. The only outlet I regularly engage in is photography because it’s relatively accessible.</p>
                                    </div>
                                </div>
                            </label>
                        </div>
                    </div>
                </section>

                <section class="interview-block">
                    <div class="question-wrap">
                        <span class="interview-number">[2]</span>
                        <p class="question">What pulls you toward it, keeps you in it, or keeps you at a distance? What is it about it that's led to its place in your life?</p>
                    </div>
                    <div class="bubble-row">
                        <img class="icon-photo" src="6.jpg" alt="">
                        <div class="bubble-wrap">
                            <div class="bubble-tail"></div>
                            <input type="checkbox" id="bubble-2" class="bubble-toggle">
                            <label class="bubble" for="bubble-2">
                                <span class="dots">...</span>
                                <div class="answer-wrap">
                                    <div class="answer-inside">
                                        <p class="answer-text">Lack of exposure is probably the reason for my limited participation in artistic endeavors.</p>
                                    </div>
                                </div>
                            </label>
                        </div>
                    </div>
                </section>

            </div>

            <footer class="footer">
                <p><span>dialogue with</span><span class="person">my mom</span></p>
                <p class="date">recorded september 17th, 2026</p>
            </footer>

        </div>

    </body>
</html>
