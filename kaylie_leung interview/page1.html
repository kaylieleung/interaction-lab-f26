<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <title>interview detail page 1</title>
        <link rel="stylesheet" href="main.css">
    </head>

    <body>

        <div class="detail-page" style="--accent: #FF43C2; --accent-hover: #8D0049; --icon-w: 115px; --icon-h: 113px;">
            
            <div class="banner" style="--meta-top: 380px;">
                <a class="home-button" href="index.html">home.</a>
                <span class="banner-number">[1]</span>
                <span class="banner-who">my dad</span>
                <h1 class="headline headline-1" style="--headline-size: 272px; --headline-leading: 204px;">
                    <span class="line"><span>I</span><span>CREATE</span></span>
                    <span class="line">THEREFORE</span>
                    <span class="line"><span>I</span><span>AM.</span></span>
                </h1>
            </div>

           <div class="interview-list">

                <section class="interview-block">
                    <div class="question-wrap">
                        <span class="interview-number">[1]</span>
                        <p class="question">Where do you personally stand in relation to creativity?</p>
                    </div>
                    <div class="bubble-row">
                        <img class="icon-photo" src="1.jpg" alt="">
                        <div class="bubble-wrap">
                            <div class="bubble-tail"></div>
                            <input type="checkbox" id="bubble-1" class="bubble-toggle">
                            <label class="bubble" for="bubble-1">
                                <span class="dots">...</span>
                                <div class="answer-wrap">
                                    <div class="answer-inside">
                                        <p class="answer-text">My creativity is a blend of intellectual curiosity and emotional connection/resonance/empathy.</p>
                                    </div>
                                </div>
                            </label>
                        </div>
                    </div>
                </section>

                <section class="interview-block">
                    <div class="question-wrap">
                        <span class="interview-number">[2]</span>
                        <p class="question">What pulls you toward it, keeps you in it, or keeps you at a distance? What is it about it that's led to its place in your life?</p>
                    </div>
                    <div class="bubble-row">
                        <img class="icon-photo" src="1.jpg" alt="">
                        <div class="bubble-wrap">
                            <div class="bubble-tail"></div>
                            <input type="checkbox" id="bubble-2" class="bubble-toggle">
                            <label class="bubble" for="bubble-2">
                                <span class="dots">...</span>
                                <div class="answer-wrap">
                                    <div class="answer-inside">
                                        <p class="answer-text">I have a desire to help/serve others with hopefully a unique/fun spin. Be it games, cooking, or relationships.</p>
                                    </div>
                                </div>
                            </label>
                        </div>
                    </div>
                </section>

            </div>

            <footer class="footer">
                <p><span>dialogue with</span><span class="person">my dad</span></p>
                <p class="date">recorded september 17th, 2026</p>
            </footer>

        </div>

    </body>
</html>
